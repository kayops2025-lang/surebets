<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma EV Pro - Arbitraje & Casino</title>
  <style>
    :root {
      --bg: #0b1318;
      --card: #15222b;
      --border: #243644;
      --text: #f0f6fc;
      --muted: #8b9eb0;
      --teal: #0e7c7b;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--text);
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }
    .tab-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡ SUREBET & CASINO EV PRO</span>
      <span class="badge">Suite Unificada</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="btnSports" onclick="loadModule('sports')">
        ⚽ Arbitraje Deportivo
      </button>
      <button class="tab-btn" id="btnCasino" onclick="loadModule('casino')">
        🎰 Casino Rollover & EV
      </button>
    </div>
  </header>

  <iframe id="appFrame" class="viewport" src="deportes/index.html" title="Suite EV"></iframe>

  <script>
    function loadModule(mod) {
      const frame = document.getElementById('appFrame');
      const btnSports = document.getElementById('btnSports');
      const btnCasino = document.getElementById('btnCasino');

      if (mod === 'sports') {
        frame.src = 'deportes/index.html';
        btnSports.classList.add('active');
        btnCasino.classList.remove('active');
      } else {
        frame.src = 'casino/index.html';
        btnCasino.classList.add('active');
        btnSports.classList.remove('active');
      }
    }
  </script>
</body>
</html>
